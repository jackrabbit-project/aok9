name: Refresh Grading Guide

# The NRD revises the Sprint Grading Guide in place on Google Sheets. This picks
# up a new edition and opens a pull request.
#
# It deliberately does not commit to main. This file is where every dog's WAVE
# comes from, so a bad edition landing unreviewed is a meet scored on the wrong
# numbers before anyone notices. A human reads the summary and merges.

on:
  schedule:
    # Mondays, after a typical weekend of meets has been processed.
    - cron: '17 13 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-grading-guide
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Keep the current guide to compare against
        run: cp src/data/grading-guide.json "$RUNNER_TEMP/previous-guide.json"

      # Fails loudly rather than quietly if the sheet stops being world-readable,
      # if the documents page stops linking it, or if its columns have moved --
      # the converter checks the spreadsheet's headings before reading it.
      - name: Fetch and convert the published guide
        run: npm run refresh-guide

      - name: Has anything changed?
        id: changed
        run: |
          if git diff --quiet -- src/data/grading-guide.json; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'The published guide matches the bundled one. Nothing to do.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Check the app still builds and scores correctly
        if: steps.changed.outputs.changed == 'true'
        run: |
          npm test
          npm run build

      - name: Summarise the change
        if: steps.changed.outputs.changed == 'true'
        id: summary
        run: |
          node scripts/diff-grading-guide.mjs \
            "$RUNNER_TEMP/previous-guide.json" src/data/grading-guide.json \
            > "$RUNNER_TEMP/summary.md"
          cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"
          {
            echo "source=$(node -p "require('./src/data/grading-guide.json').source")"
            echo "dogs=$(node -p "require('./src/data/grading-guide.json').dogs.length")"
          } >> "$GITHUB_OUTPUT"

      - name: Open or update the pull request
        if: steps.changed.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE: ${{ steps.summary.outputs.source }}
          DOGS: ${{ steps.summary.outputs.dogs }}
        run: |
          set -euo pipefail
          BRANCH=guide-refresh
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B "$BRANCH"
          git add src/data/grading-guide.json
          git commit -m "Update the bundled Grading Guide to ${SOURCE}" \
                     -m "${DOGS} dogs. Converted from the sheet published on the AOK9 documents page. See the pull request for what changed."
          # Force, because this branch is reopened from main on every run rather
          # than accumulating one commit per week.
          git push --force origin "$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create --base main --head "$BRANCH" \
              --title "Grading Guide: ${SOURCE}" \
              --body-file "$RUNNER_TEMP/summary.md"
          else
            gh pr comment "$BRANCH" --body-file "$RUNNER_TEMP/summary.md"
            echo 'Existing pull request updated.' >> "$GITHUB_STEP_SUMMARY"
          fi
